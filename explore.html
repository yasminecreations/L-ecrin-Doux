<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L'Écrin Doux</title>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    
    background:#eee;
    font-size: 30px;
   
    font-family: Arial, sans-serif;
}

h1, h2, .logo h2 {
    font-family: 'Parisienne', cursive;
}




.navbar{
    position:fixed;
    top:0;
    width:100%;
    height:70px;
    background:#bdbdbd;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:100;
    font-family: 'Parisienne';
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}
.h2{
    font-family: 'Parisienne';
    font-size: 1.5rem;
    color: rgb(230, 230, 230);
}
.logo img{
    width:40px;
    height:40px;
    border-radius:50%;
}

.logo h2{
    font-family:'Parisienne';
    font-size:30px;
}

.navbar nav a{
    color:#fff;
    text-decoration:none;
    margin-left:15px;
    font-size:32px;
}


.box1 {
    width: 100%;
    min-height: 60vh;
    background-image: url(ring.jpg);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
}

.ttle1 {
    font-family: 'Parisienne';
    font-size: clamp(2rem, 6vw, 3.5rem);
    padding-left: 1rem;
    color: rgb(136, 136, 136);
}

.button {
    border-radius: 20px;
    width: 50px;
    height: 40px;
}
.tiktok{
    padding:25px;
    text-align:center;
    background:#f2f2f2;
}

.tiktok h1{
    font-family: 'Parisienne';
    font-size:42px;
}

.tiktok img{
    width:200px;
    height:200px;
    border-radius:50%;
    margin:20px 0;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.tiktok button{
    padding:10px 25px;
    border-radius:20px;
    border:2px solid #555;
    background:#e3e2dd;
    font-size:18px;
    cursor:pointer;
}
.instagram{
    padding:25px;
    text-align:center;
    background:#f2f2f2;
}

.instagram h1{
    font-family: 'Parisienne';
    font-size:42px;
}

.instagram img{
    width:200px;
    height:200px;
    border-radius:50%;
    margin:20px 0;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.instagram button{
    padding:10px 25px;
    border-radius:20px;
    border:2px solid #555;
    background:#e3e2dd;
    font-size:18px;
    cursor:pointer;
}
@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
    height: auto;
    padding: 10px;
  }

  .navbar nav {
    margin-top: 10px;
  }

  .navbar nav a {
    margin: 0 10px;
    font-size: 16px;
  }
}

</style>
   </head>

  <body>
      
  

<header class="navbar">
    <div class="logo">
        <img class="img1" src="ijij.jpeg" alt="logo">
        <h2>L'Écrin Doux</h2>
    </div>
    <nav>
        <a href="index.html"> Acceuil</a>
        <a href="explore.html">Explore</a>
        <a href="nos-produits.html">Produits</a>
    </nav>
</header>
<div class="box1">
    <div class="titles">
    <h1 class="ttle1"> 
        L’Écrin Doux</h1>
       
        </div> </div>
        
        <section class="tiktok">
            <h1>Notre Page TikTok</h1>
            <img src="ijij.jpeg">
            <a href="https://www.tiktok.com/@lecrindoux.shop">
                <button>Page TikTok</button>
            </a>
        </section>
        <section class="instagram">
            <h1>Notre Page instagram</h1>
            <img src="ijij.jpeg">
            <a href="https://www.instagram.com/lecrindoux.shop">
                <button>Page instagram</button>
            </a>
        </section>
          
  
</body>
